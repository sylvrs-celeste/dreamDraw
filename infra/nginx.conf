server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CloudFront and the ALB sit in front in production, but the container
    # should not be lying about sizes on its own either.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite content-hashes these filenames, so a changed file is a new URL and
    # this can be cached hard. CloudFront has a matching /assets/* behaviour.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The API lives in the other container. proxy_pass by service name, which
    # docker's embedded DNS resolves on the compose network.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Appended, not replaced: the rate limiter reads the first entry, and
        # in production CloudFront has already put the viewer's address there.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 25 MB uploads. The nginx default is 1 MB, which would reject a photo
        # with a 413 long before FastAPI ever saw it.
        client_max_body_size 26m;
        # Large uploads are slow on a domestic connection; the 60s default
        # cuts them off mid-transfer.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Single page app: every unknown path is a client route, not a 404.
    # index.html itself must never be cached hard, or a deploy never reaches
    # anyone who has already visited.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
